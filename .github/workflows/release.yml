name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --clean --noconfirm ariadne.spec

    - name: Run frozen executable smoke test
      run: |
        pytest tests/integration/test_frozen_exe.py -v

    - name: Package Release Zip & Checksums
      id: package
      shell: bash
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        ARCHIVE_NAME="ariadne-${TAG_NAME}-windows-x64"
        cd dist
        mv ariadne "${ARCHIVE_NAME}"
        cp ../README.md "${ARCHIVE_NAME}/README.md"
        cp ../LICENSE "${ARCHIVE_NAME}/LICENSE"
        cp ../RELEASE_NOTICE.txt "${ARCHIVE_NAME}/RELEASE_NOTICE.txt"
        7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
        sha256sum "${ARCHIVE_NAME}.zip" > checksums.txt
        cat checksums.txt
        echo "archive_name=${ARCHIVE_NAME}.zip" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/${{ steps.package.outputs.archive_name }}
          dist/checksums.txt
        body: |
          ## Ariadne Procedural World Verifier (${{ github.ref_name }})

          > **⚠️ ALPHA PRE-RELEASE**: This is an early technical evaluation build. Protocol specifications and formats may change. Not intended for production use.

          ### Windows Distribution (64-bit)
          - Single-folder portable distribution (`--onedir`).
          - Zero Python dependency required. Extract and run `ariadne.exe`.
          - Bundled with `README.md`, `LICENSE`, and `RELEASE_NOTICE.txt`.

          ### How to Run (CLI Tool Notice)
          - Ariadne is a **terminal command-line tool**, not a desktop GUI.
          - **Do not double-click `ariadne.exe` directly in File Explorer** (the terminal window will close immediately).
          - To run: Open the extracted folder, click the address bar, type `cmd`, press **Enter**, then run:
            ```cmd
            .\ariadne.exe --help
            ```

          ### Security & Integrity Notice
          - SHA-256 checksum is provided in `checksums.txt`.
          - *Note*: This binary is currently unsigned (built via GitHub Actions CI). Windows SmartScreen may show an unknown publisher warning on first launch. Click **More info -> Run anyway**. Code is 100% open source and reproducible.
        draft: false
        prerelease: true
